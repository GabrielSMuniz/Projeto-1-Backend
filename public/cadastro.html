<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Cadastro</h1>
      <!-- flash:erro -->
      <form action="/cadastro" method="post" class="form-grid">
        <div class="field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="6" required>
        </div>

        <div class="field">
          <label for="confirmar-senha">Confirmar senha</label>
          <input type="password" id="confirmar-senha" name="confirmarSenha" autocomplete="new-password" minlength="6" required>
        </div>

        <button type="submit" class="primary-button">Cadastrar</button>
      </form>
      <button type="button" class="ghost-button" onclick="window.location.href='/login'">Voltar para login</button>
    </div>
  </div>

  <script>
    const senhaInput = document.getElementById('senha');
    const confirmarSenhaInput = document.getElementById('confirmar-senha');

    function validarSenha() {
      if (senhaInput.value.length < 6) {
        senhaInput.setCustomValidity('A senha deve ter pelo menos 6 caracteres.');
        return;
      }

      if (senhaInput.value !== confirmarSenhaInput.value) {
        confirmarSenhaInput.setCustomValidity('As senhas não coincidem.');
        return;
      }

      senhaInput.setCustomValidity('');
      confirmarSenhaInput.setCustomValidity('');
    }

    senhaInput.addEventListener('input', validarSenha);
    confirmarSenhaInput.addEventListener('input', validarSenha);
  </script>
</body>
</html>
